<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1B2336" />
    </linearGradient>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="280" cy="200" r="160" fill="#22C55E" opacity="0.08" filter="blur(60px)" />
  <circle cx="800" cy="200" r="200" fill="#38BDF8" opacity="0.05" filter="blur(80px)" />

  <!-- Brand Symbol (Centered Left) -->
  <g transform="translate(140, 100) scale(0.78)">
    <rect x="-20" y="-20" width="296" height="296" rx="64" fill="#131D33" stroke="#22C55E" stroke-opacity="0.3" stroke-width="2"/>
    <path fill="url(#logo-grad)" d="
      M 36 52
      C 36 40 44 32 56 32
      L 80 32
      L 128 80
      L 176 32
      L 200 32
      C 212 32 220 40 220 52
      L 220 208
      C 220 218 212 224 200 224
      L 172 224
      C 164 224 160 218 160 210
      L 160 96
      L 128 128
      L 96 96
      L 96 210
      C 96 218 92 224 84 224
      L 56 224
      C 44 224 36 218 36 208
      Z" />
  </g>

  <!-- Typography -->
  <g transform="translate(430, 185)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="68" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">MemClean</text>
    <rect x="330" y="-52" width="76" height="28" rx="6" fill="#1E293B" stroke="#22C55E" stroke-width="1"/>
    <text x="368" y="-33" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#22C55E" text-anchor="middle">v1.0.0</text>
    <text y="42" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="22" font-weight="500" fill="#94A3B8">Ultra-Lightweight Windows Memory Optimizer</text>
    <text y="74" font-family="'JetBrains Mono', monospace" font-size="15" fill="#38BDF8">&lt; 500 KB Binary  •  0.0% Idle CPU  •  Pure Rust NT Kernel Purging</text>
  </g>
